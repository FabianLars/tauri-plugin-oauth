name: Format

on:
  push:
    branches:
      - v2
      - v1
  pull_request:
    branches:
      - v2
      - v1

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check